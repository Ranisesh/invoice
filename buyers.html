<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Buyers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Manage Buyers</h1>
        <nav>
            <ul>
                <li><a href="index.html">Invoice</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="buyers.html">Buyers</a></li>
                </ul>
        </nav>

        <div class="add-buyer-form">
            <h2>Add New Buyer</h2>
            <div class="form-group">
                <label for="new-buyer-name">Name:</label>
                <input type="text" id="new-buyer-name">
            </div>
            <div class="form-group">
                <label for="new-buyer-address">Address:</label>
                <input type="text" id="new-buyer-address">
            </div>
            <button onclick="addBuyer()">Add Buyer</button>
        </div>

        <div class="buyer-list">
            <h2>Buyer List</h2>
            <table id="buyer-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Address</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="buyer-body">
                </tbody>
            </table>
        </div>
    </div>
    <script src="buyers.js"></script>
</body>
</html>
