<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Manage Products</h1>
        <nav>
            <ul>
                <li><a href="index.html">Invoice</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="buyers.html">Buyers</a></li>
                </ul>
        </nav>

        <div class="add-product-form">
            <h2>Add New Product</h2>
            <div class="form-group">
                <label for="new-product-name">Name:</label>
                <input type="text" id="new-product-name">
            </div>
            <div class="form-group">
                <label for="new-product-price">Price:</label>
                <input type="number" id="new-product-price" min="0" step="0.01">
            </div>
            <button onclick="addProduct()">Add Product</button>
        </div>

        <div class="product-list">
            <h2>Product List</h2>
            <table id="product-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="product-body">
                </tbody>
            </table>
        </div>
    </div>
    <script src="products.js"></script>
</body>
</html>
